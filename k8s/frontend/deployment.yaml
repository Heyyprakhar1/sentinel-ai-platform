apiVersion: apps/v1
kind: Deployment

metadata:
  namespace: sentinelai-dev
  name: sentinelai-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sentinelai-frontend

  template:

    metadata:
      labels:
        app: sentinelai-frontend

    spec:

      containers:

        - name: sentinelai-frontend

          image: sentinelai-frontend:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          resources:

            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"

          livenessProbe:

            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:

            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10
