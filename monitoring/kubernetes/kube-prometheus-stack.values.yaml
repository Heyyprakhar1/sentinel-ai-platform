# ==========================================================
# SentinelAI - kube-prometheus-stack
# ==========================================================

grafana:
  enabled: true

  adminUser: admin
  adminPassword: admin123

  service:
    type: ClusterIP

  persistence:
    enabled: false

prometheus:
  service:
    type: ClusterIP

  prometheusSpec:
    retention: 7d

    storageSpec: {}

alertmanager:
  enabled: true

  service:
    type: ClusterIP

  alertmanagerSpec:
    storage: {}

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  create: true
